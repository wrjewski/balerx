name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux ARM linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install --yes gcc-aarch64-linux-gnu

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}
        working-directory: balerx-sensor

      - name: Build release binary
        working-directory: balerx-sensor
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          profile="balerx-sensor/target/${TARGET}/release"
          stage="${RUNNER_TEMP}/balerx-stage"
          rm -rf "${stage}"
          mkdir -p "${stage}"
          cp LICENSE NOTICE "${stage}/"
          mkdir -p dist
          if [[ "${TARGET}" == *windows* ]]; then
            cp "${profile}/balerx.exe" "${stage}/balerx.exe"
            archive="dist/balerx-${TARGET}.zip"
            # cygpath: GITHUB_WORKSPACE is D:\... and a raw "D:" path is parsed as a remote host.
            archive_win="$(cygpath -w "${GITHUB_WORKSPACE}/${archive}")"
            stage_win="$(cygpath -w "${stage}")"
            # GNU tar -a writes a tar archive even when the name ends in .zip.
            # install.ps1 unpacks with Expand-Archive, so the asset must be a real zip
            # with balerx.exe, LICENSE, and NOTICE at the archive root.
            BALERX_ARCHIVE_WIN="${archive_win}" BALERX_STAGE_WIN="${stage_win}" \
              powershell.exe -NoProfile -Command '
                $ErrorActionPreference = "Stop"
                $archive = $env:BALERX_ARCHIVE_WIN
                $stage = $env:BALERX_STAGE_WIN
                if (Test-Path -LiteralPath $archive) { Remove-Item -LiteralPath $archive -Force }
                Compress-Archive -Path @(
                  (Join-Path $stage "balerx.exe"),
                  (Join-Path $stage "LICENSE"),
                  (Join-Path $stage "NOTICE")
                ) -DestinationPath $archive
                $dest = Join-Path $env:RUNNER_TEMP "balerx-zip-test"
                if (Test-Path -LiteralPath $dest) { Remove-Item -LiteralPath $dest -Recurse -Force }
                Expand-Archive -LiteralPath $archive -DestinationPath $dest
                foreach ($name in @("balerx.exe", "LICENSE", "NOTICE")) {
                  if (-not (Test-Path -LiteralPath (Join-Path $dest $name))) {
                    throw "zip root is missing $name"
                  }
                }
              '
          else
            cp "${profile}/balerx" "${stage}/balerx"
            archive="dist/balerx-${TARGET}.tar.gz"
            tar --create --gzip --file "${archive}" --directory "${stage}" balerx LICENSE NOTICE
          fi

      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: balerx-${{ matrix.target }}
          path: dist/balerx-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish / checksums-sbom-attest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate source SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: artifacts/balerx.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Write checksums
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/balerx-release"
          rm -rf "${stage}"
          mkdir -p "${stage}"
          find artifacts -type f \( -name 'balerx-*.tar.gz' -o -name 'balerx-*.zip' -o -name 'balerx.spdx.json' \) -exec cp -t "${stage}" {} +
          cd "${stage}"
          # Reject a tar archive renamed to .zip before hashing the files that ship.
          python3 -m zipfile -t balerx-x86_64-pc-windows-msvc.zip
          python3 -m zipfile -t balerx-aarch64-pc-windows-msvc.zip
          sha256sum balerx-*.tar.gz balerx-*.zip > SHA256SUMS
          assets=(
            balerx-x86_64-unknown-linux-gnu.tar.gz
            balerx-aarch64-unknown-linux-gnu.tar.gz
            balerx-x86_64-apple-darwin.tar.gz
            balerx-aarch64-apple-darwin.tar.gz
            balerx-x86_64-pc-windows-msvc.zip
            balerx-aarch64-pc-windows-msvc.zip
          )
          for name in "${assets[@]}"; do
            test -f "${name}"
            awk -v name="${name}" '$2 == name { found = 1 } END { exit !found }' SHA256SUMS
          done
          echo "Checksums:"
          cat SHA256SUMS
          echo "stage=${stage}" >> "${GITHUB_ENV}"

      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/balerx-release/balerx-*
            ${{ runner.temp }}/balerx-release/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" "${stage}"/* \
            --title "${GITHUB_REF_NAME}" \
            --notes "Balerx Gate scanner ${GITHUB_REF_NAME}. Release binaries are unsigned. Installers download these archives from releases/latest/download and check SHA256SUMS. The SBOM is balerx.spdx.json."
