name: Feature request
description: A change to the scanner, rules, schema, or docs
title: 'feat: '
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What the scanner cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The behavior you want, including which command or schema object it affects.
    validations:
      required: true
